name: Validate toolkit

on:
  push:
    branches:
      - main
      - "hardening/**"
      - "audit/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-toolkit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate hardening invariants
        run: node scripts/validate-toolkit.mjs
