name: Validate toolkit

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate hardening invariants
        run: node scripts/validate-toolkit.mjs
